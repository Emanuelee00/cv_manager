[project]
name = "cvagents"
version = "0.1.0"
description = "Base di dati personale, ricerca (RAG) e lettura GitHub per costruire CV e lettere"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "questionary>=2.1.1",
    "rembg[cpu]>=2.0.85",
    "rich>=15.0.0",
]

[project.scripts]
cvagents = "cvagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvagents"]
